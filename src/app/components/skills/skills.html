<section id="skills">
  <h2 class="text-2xl font-semibold text-zinc-100 mb-8">Skills</h2>

  <dl class="space-y-5">
    @for (g of groups; track g.label) {
      <div class="sm:flex gap-6">
        <dt class="sm:w-40 shrink-0 text-sm text-zinc-500 mb-2 sm:mb-0 sm:pt-1">{{ g.label }}</dt>
        <dd class="flex flex-wrap gap-2">
          @for (s of g.items; track s) {
            <span class="rounded-md border border-zinc-800 bg-zinc-900 px-2.5 py-1 text-sm text-zinc-200">{{ s }}</span>
          }
        </dd>
      </div>
    }
  </dl>
</section>
