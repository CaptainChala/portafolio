<header class="sticky top-0 z-50 w-full border-b border-zinc-800/80 bg-zinc-950/80 backdrop-blur">
  <nav class="relative max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a href="#" class="font-semibold text-zinc-100 tracking-tight">cristian<span class="text-emerald-400">.chala</span></a>

    <button type="button" (click)="handleButtonClick()" class="md:hidden p-2 -me-2 text-zinc-400 hover:text-zinc-100"
      [attr.aria-expanded]="isheaderShow" aria-controls="nav-links" aria-label="Abrir menú">
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        @if (isheaderShow) { <path d="M18 6 6 18M6 6l12 12"/> } @else { <path d="M3 6h18M3 12h18M3 18h18"/> }
      </svg>
    </button>

    <div id="nav-links" [ngClass]="{ 'hidden': !isheaderShow }"
      class="absolute md:static top-16 inset-x-0 md:flex border-b md:border-0 border-zinc-800 bg-zinc-950 md:bg-transparent">
      <div class="flex flex-col md:flex-row gap-1 md:gap-6 p-4 md:p-0 text-sm" (click)="isheaderShow = false">
        <a href="#projects" class="py-2 md:py-0 text-zinc-400 hover:text-zinc-100">Proyectos</a>
        <a href="#experience" class="py-2 md:py-0 text-zinc-400 hover:text-zinc-100">Experiencia</a>
        <a href="#education" class="py-2 md:py-0 text-zinc-400 hover:text-zinc-100">Educación</a>
        <a href="#skills" class="py-2 md:py-0 text-zinc-400 hover:text-zinc-100">Skills</a>
      </div>
    </div>
  </nav>
</header>
