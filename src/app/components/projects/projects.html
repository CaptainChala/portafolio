<section id="projects">
  <h2 class="text-2xl font-semibold text-zinc-100 mb-8">Proyectos</h2>

  <div class="grid gap-4 sm:grid-cols-2">
    @for (p of projects; track p.name) {
      <article class="flex flex-col rounded-xl border border-zinc-800 bg-zinc-900/50 p-5 hover:border-zinc-700 transition"
        [class.sm:col-span-2]="p.featured">
        <div class="flex items-start justify-between gap-3">
          <h3 class="text-lg font-semibold text-zinc-100">{{ p.name }}</h3>
          @if (p.status) {
            <span class="shrink-0 rounded-full bg-emerald-500/10 px-2.5 py-0.5 text-xs font-medium text-emerald-400">{{ p.status }}</span>
          }
        </div>
        <p class="mt-2 text-sm leading-relaxed text-zinc-400 grow">{{ p.description }}</p>

        <ul class="mt-4 flex flex-wrap gap-1.5">
          @for (t of p.technologies; track t) {
            <li class="rounded-md bg-zinc-800 px-2 py-0.5 text-xs text-zinc-300">{{ t }}</li>
          }
        </ul>

        <div class="mt-4 flex gap-4 text-sm">
          @if (p.live) { <a [href]="p.live" target="_blank" rel="noopener" class="text-emerald-400 hover:underline">Ver sitio ↗</a> }
          @if (p.repo) { <a [href]="p.repo" target="_blank" rel="noopener" class="text-zinc-300 hover:underline">Código ↗</a> }
          @else { <span class="text-zinc-500">Repositorio privado</span> }
        </div>
      </article>
    }
  </div>
</section>
